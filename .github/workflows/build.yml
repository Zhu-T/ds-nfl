# Checks and builds the Windows installer on every push to main, then publishes it
# as a release so there is a permanent download link rather than a 14-day artifact.
# Live ESPN tests skip themselves here: CI has no league credentials, and never should.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Releases are written from here; nothing else needs writing.
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        shell: bash
        run: |
          for p in packages/core packages/adapters packages/llm apps/web; do
            echo "== $p"
            npx tsc --noEmit -p "$p/tsconfig.json"
          done

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run dist --workspace=@ds-nfl/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ds-nfl-installer
          path: apps/desktop/dist/ds-nfl Setup *.exe
          if-no-files-found: error
          retention-days: 14

      # One release per build of main, so every installer keeps a permanent link.
      # The app version rarely changes, so the build number makes the tag unique.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="v$version-build.${{ github.run_number }}"
          installer=$(ls "apps/desktop/dist/ds-nfl Setup "*.exe)
          # Written to a file so the notes keep their own line breaks and no YAML indent.
          git log -1 --pretty=%s > notes.md
          printf '\n%s\n' "Windows installer, built from ${{ github.sha }}." >> notes.md
          printf '%s\n' "It is unsigned, so SmartScreen warns on first run. Installing over an existing copy keeps your leagues and settings." >> notes.md
          gh release create "$tag" "$installer" \
            --title "ds-nfl $version (build ${{ github.run_number }})" \
            --notes-file notes.md
