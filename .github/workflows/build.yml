# Checks and builds the Windows installer on every push to main.
# The installer is attached to the run as an artifact ("ds-nfl-installer").
# Live ESPN tests skip themselves here: CI has no league credentials, and never should.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        shell: bash
        run: |
          for p in packages/core packages/adapters packages/llm apps/web; do
            echo "== $p"
            npx tsc --noEmit -p "$p/tsconfig.json"
          done

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run dist --workspace=@ds-nfl/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ds-nfl-installer
          path: apps/desktop/dist/ds-nfl Setup *.exe
          if-no-files-found: error
          retention-days: 14
